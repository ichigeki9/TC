{% comment %}Przycisk działający we wszystkich programach pocztowych. Użycie: include "emails/_button.html" with url=… label=…{% endcomment %}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:32px 0;">
  <tr>
    <td bgcolor="#e8ff00" style="background-color:#e8ff00;">
      <a href="{{ url }}" target="_blank" style="display:inline-block; padding:16px 36px; font-family:Arial, Helvetica, sans-serif; font-size:14px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:#0a0a0a; text-decoration:none;">{{ label }}</a>
    </td>
  </tr>
</table>
