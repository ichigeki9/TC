<div class="tc-field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<small class="tc-help">{{ field.help_text|safe }}</small>{% endif %}
  {% for error in field.errors %}<small class="tc-error">{{ error }}</small>{% endfor %}
</div>
